<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>DXF to G-code (ShopSabre Plasma)</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>DXF &rarr; G-code</h1>
    <p class="subtitle">Plasma cutter post-processor &mdash; ShopSabre / WinCNC style output</p>
  </header>

  <main>
    <section class="panel">
      <h2>1. File</h2>
      <input type="file" id="dxfFile" accept=".dxf" />
      <div id="fileStatus" class="status"></div>
    </section>

    <section class="panel">
      <h2>2. Settings</h2>
      <form id="settingsForm">
        <div class="grid">
          <label>Units
            <select name="units">
              <option value="mm">mm</option>
              <option value="in">inch</option>
            </select>
          </label>
          <label>Kerf width <input type="number" step="0.01" name="kerf_width" value="1.0" /></label>
          <label>Pierce delay (s) <input type="number" step="0.01" name="pierce_delay" value="0.4" /></label>
          <label>Lead-in length <input type="number" step="0.1" name="lead_in_length" value="3" /></label>
          <label>Lead-out length <input type="number" step="0.1" name="lead_out_length" value="3" /></label>
          <label>Segment tolerance <input type="number" step="0.01" name="segment_tolerance" value="0.05" /></label>
          <label class="checkbox"><input type="checkbox" name="normalize_origin" checked /> Normalize to origin (0,0)</label>
        </div>
      </form>
    </section>

    <section class="panel">
      <h2>3. Preview</h2>
      <canvas id="preview" width="600" height="500"></canvas>
      <div id="previewStatus" class="status"></div>
    </section>

    <section class="panel">
      <h2>4. Generate</h2>
      <button id="convertBtn">Convert to G-code</button>
      <button id="downloadBtn" disabled>Download .nc</button>
      <div id="convertStatus" class="status"></div>
      <textarea id="gcodeOutput" readonly placeholder="G-code output will appear here..."></textarea>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
